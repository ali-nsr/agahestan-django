{% load static %}
<div class="ad-gallery">
    {% with images=ad.gallery.all %}
    {% if images %}

        <div class="featured-gallery-slide">
            {% for img in images %}
                <div class="dlf-flew">
                    <a href="{{ img.image.url }}" class="mfp-gallery">
                        <img src="{{ img.image.url }}" class="img-fluid mx-auto" alt="{{ ad.title }}">
                    </a>
                </div>
            {% endfor %}
        </div>

    {% else %}
        <div class="ad-gallery-empty">
            <img src="{% static 'assets/img/placeholder.png' %}" class="img-fluid" alt="بدون تصویر">
        </div>
    {% endif %}
    {% endwith %}
</div>


<style>
    .ad-gallery {
    border-radius: 12px;
    overflow: hidden;
    background: #f5f5f5;
}

.ad-gallery .featured-gallery-slide .dlf-flew img {
    width: 100%;
    height: 420px;
    object-fit: cover;
}

.ad-gallery-empty img {
    width: 100%;
    height: 420px;
    object-fit: contain;
    opacity: .4;
}

@media (max-width: 768px) {
    .ad-gallery .featured-gallery-slide .dlf-flew img,
    .ad-gallery-empty img {
        height: 240px;
    }
}
</style>
<script>
$(document).ready(function () {
    const $slider = $('.featured-gallery-slide');

    if ($slider.length) {
        const slideCount = $slider.children().length;

        $slider.slick({
            slidesToShow: 1,
            slidesToScroll: 1,
            arrows: slideCount > 1,   // ← اگه ۱ عکس بود، فلش نده
            dots: false,
            infinite: slideCount > 1, // ← ۱ عکس: بی‌نهایت نچرخه
            rtl: true,
        });
    }

    if ($.fn.magnificPopup) {
        $('.mfp-gallery').magnificPopup({
            type: 'image',
            gallery: { enabled: true },
        });
    }
});
</script>
