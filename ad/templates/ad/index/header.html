{% load static %}
<style>
    :root {
        --brand: #f41b3b;
        --brand-dark: #d3152f;
        --brand-light: #ff5470;
        --coral: #ff7a59;
        --orange: #ff9f1c;
        --yellow: #ffc93c;
        --pink: #ff5c8a;
    }

    /* ══════════════════════════════════════════
       HERO — Warm & Cheerful (based on #f41b3b)
       ══════════════════════════════════════════ */
    .hero {
        position: relative;
        padding: 70px 0 76px;
        display: flex;
        align-items: center;
        color: #2a0512;
        overflow: hidden;
        isolation: isolate;
        background:
            linear-gradient(180deg, #fff8f5 0%, #fff5f7 50%, #fffaf2 100%);
    }

    @media (min-width: 992px) {
        .hero {
            padding: 88px 0 94px;
        }
    }

    /* ─── گرادیانت‌های ملایم گرم ─── */
    .hero::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
            radial-gradient(ellipse 45% 55% at 92% 8%, rgba(244, 27, 59, .15), transparent 60%),
            radial-gradient(ellipse 40% 55% at 8% 92%, rgba(255, 159, 28, .15), transparent 60%),
            radial-gradient(ellipse 35% 45% at 5% 15%, rgba(255, 201, 60, .18), transparent 60%);
        pointer-events: none;
        z-index: 0;
    }

    /* ─── orb‌ها ─── */
    .hero-orb {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
    }
    .hero-orb-1 {
        top: -120px;
        right: -100px;
        width: 360px;
        height: 360px;
        background: radial-gradient(circle, rgba(244, 27, 59, .22), transparent 70%);
        filter: blur(50px);
    }
    .hero-orb-2 {
        bottom: -140px;
        left: -100px;
        width: 340px;
        height: 340px;
        background: radial-gradient(circle, rgba(255, 159, 28, .2), transparent 70%);
        filter: blur(55px);
    }

    /* ══════════════════════════════════════════
       محتوا
       ══════════════════════════════════════════ */
    .hero-content {
        position: relative;
        z-index: 2;
        max-width: 720px;
        margin: 0 auto;
        text-align: center;
        animation: fadeUp .7s cubic-bezier(.16, 1, .3, 1);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── بج ─── */
    .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 16px;
        margin-bottom: 20px;
        font-size: .75rem;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, var(--brand) 0%, var(--orange) 100%);
        border: none;
        border-radius: 100px;
        box-shadow: 0 6px 20px rgba(244, 27, 59, .25);
        animation: fadeUp .7s cubic-bezier(.16, 1, .3, 1) .08s both;
    }

    .hero-badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, .35);
    }

    /* ─── عنوان ─── */
    .hero-title {
        font-size: clamp(1.85rem, 4.5vw, 3rem);
        font-weight: 900;
        line-height: 1.2;
        margin: 0 0 16px;
        color: #2a0512;
        letter-spacing: -.7px;
        text-wrap: balance;
        animation: fadeUp .7s cubic-bezier(.16, 1, .3, 1) .12s both;
    }

    .hero-title-brand {
        background: linear-gradient(135deg, var(--brand) 0%, var(--orange) 60%, var(--yellow) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
    }

    /* ─── توضیحات ─── */
    .hero-desc {
        font-size: 1rem;
        line-height: 1.8;
        color: #6b4558;
        margin: 0 auto 32px;
        max-width: 500px;
        font-weight: 500;
        animation: fadeUp .7s cubic-bezier(.16, 1, .3, 1) .2s both;
    }

    /* ══════════════════════════════════════════
       جستجو
       ══════════════════════════════════════════ */
    .hero-search {
        max-width: 580px;
        margin: 0 auto 24px;
        animation: fadeUp .7s cubic-bezier(.16, 1, .3, 1) .28s both;
    }

    .hero-search-group {
        height: 60px;
        border-radius: 16px;
        overflow: hidden;
        background: #fff;
        border: 1.5px solid #f5e0e8;
        box-shadow:
            0 4px 20px rgba(244, 27, 59, .1),
            0 1px 3px rgba(0, 0, 0, .04);
        transition: all .3s cubic-bezier(.4, 0, .2, 1);
    }
    .hero-search-group:focus-within {
        border-color: var(--brand);
        box-shadow:
            0 0 0 4px rgba(244, 27, 59, .15),
            0 8px 28px rgba(244, 27, 59, .2);
        transform: translateY(-1px);
    }

    .hero-search-group .form-control {
        height: 60px;
        padding: 0 22px;
        font-size: 1rem;
        color: #2a0512;
        background: transparent;
        border: 0;
        box-shadow: none;
        font-weight: 500;
    }
    .hero-search-group .form-control::placeholder {
        color: #a892a0;
        font-weight: 400;
    }
    .hero-search-group .form-control:focus {
        box-shadow: none;
    }

    .hero-search-group .btn {
        height: 60px;
        padding: 0 30px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: .95rem;
        font-weight: 800;
        white-space: nowrap;
        color: #fff;
        background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
        border: 0;
        transition: filter .2s ease;
    }
    .hero-search-group .btn:hover,
    .hero-search-group .btn:focus {
        color: #fff;
        filter: brightness(1.08);
    }

    /* ══════════════════════════════════════════
       تگ‌ها
       ══════════════════════════════════════════ */
    .hero-tags {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        animation: fadeUp .7s cubic-bezier(.16, 1, .3, 1) .36s both;
    }

    .hero-tags-label {
        font-size: .8rem;
        color: #8a6b7c;
        font-weight: 600;
    }

    .hero-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 15px;
        font-size: .8rem;
        font-weight: 700;
        color: #2a0512;
        text-decoration: none;
        background: #fff;
        border: 1.5px solid #f5e0e8;
        border-radius: 100px;
        transition: all .25s cubic-bezier(.4, 0, .2, 1);
        box-shadow: 0 2px 6px rgba(0, 0, 0, .03);
    }

    .hero-chip i {
        font-size: .78rem;
        transition: color .2s;
    }
    .hero-chip:nth-of-type(1) i { color: var(--brand); }
    .hero-chip:nth-of-type(2) i { color: var(--orange); }
    .hero-chip:nth-of-type(3) i { color: var(--yellow); }

    /* ─── پس‌زمینه‌ی ملایم ─── */
    .hero-chip:nth-of-type(1) {
        background: #fff5f7;
        border-color: #ffd0dc;
    }
    .hero-chip:nth-of-type(2) {
        background: #fff8ec;
        border-color: #ffe0bf;
    }
    .hero-chip:nth-of-type(3) {
        background: #fffbea;
        border-color: #ffe89a;
    }

    /* ─── hover ─── */
    .hero-chip:nth-of-type(1):hover {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(244, 27, 59, .35);
    }
    .hero-chip:nth-of-type(2):hover {
        background: var(--orange);
        border-color: var(--orange);
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(255, 159, 28, .35);
    }
    .hero-chip:nth-of-type(3):hover {
        background: #f4b400;
        border-color: #f4b400;
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(244, 180, 0, .35);
    }

    .hero-chip:hover i {
        color: #fff !important;
    }

    /* ══════════════════════════════════════════
       RESPONSIVE
       ══════════════════════════════════════════ */
    @media (max-width: 991.98px) {
        .hero { padding: 56px 0 62px; }
        .hero-title { font-size: 2rem; }
        .hero-desc { font-size: .95rem; max-width: 460px; }
    }

    @media (max-width: 575.98px) {
        .hero { padding: 44px 0 50px; }
        .hero-orb-1 {
            width: 260px;
            height: 260px;
            top: -90px;
            right: -80px;
        }
        .hero-orb-2 {
            width: 240px;
            height: 240px;
            bottom: -100px;
            left: -80px;
        }

        .hero-title {
            font-size: 1.5rem;
            line-height: 1.35;
            margin-bottom: 12px;
            letter-spacing: -.3px;
        }
        .hero-desc {
            font-size: .88rem;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .hero-badge {
            font-size: .7rem;
            padding: 6px 13px;
            margin-bottom: 14px;
        }

        .hero-search-group,
        .hero-search-group .form-control,
        .hero-search-group .btn {
            height: 50px;
        }
        .hero-search-group { border-radius: 14px; }
        .hero-search-group .form-control {
            padding: 0 16px;
            font-size: .9rem;
        }
        .hero-search-group .btn {
            padding: 0 18px;
        }
        .hero-search-group .btn span {
            display: none;
        }

        .hero-chip {
            padding: 6px 13px;
            font-size: .75rem;
        }
        .hero-tags-label { font-size: .75rem; }
    }

    @media (max-width: 400px) {
        .hero { padding: 36px 0 42px; }
        .hero-title { font-size: 1.28rem; }
        .hero-desc { font-size: .83rem; margin-bottom: 20px; }
        .hero-tags { gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
        .hero-badge,
        .hero-title,
        .hero-desc,
        .hero-search,
        .hero-tags {
            animation: none !important;
        }
    }
</style>

<section class="hero">

    <div class="hero-orb hero-orb-1"></div>
    <div class="hero-orb hero-orb-2"></div>

    <div class="container">
        <div class="hero-content">

            <span class="hero-badge">
                <span class="hero-badge-dot"></span>
                پلتفرم هوشمند آگهی
            </span>

            <h1 class="hero-title">
                <span class="hero-title-brand">آگهی‌های شهر شما</span>،
                همه‌جا در دسترس
            </h1>

            <p class="hero-desc">
                خرید، فروش و خدمات در سراسر ایران — سریع، رایگان و بدون واسطه.
            </p>

            <form class="hero-search" action="" method="get" role="search">
                <div class="input-group hero-search-group">
                    <input type="search" name="q" class="form-control"
                           placeholder="چی می‌خوای پیدا کنی؟"
                           autocomplete="off" required>
                    <button class="btn" type="submit">
                        <i class="fas fa-magnifying-glass"></i>
                        <span>جستجو</span>
                    </button>
                </div>
            </form>

            <div class="hero-tags">
{#                <span class="hero-tags-label">محبوب:</span>#}
                <a href="/iran/" class="hero-chip"><i class="fas fa-list"></i> آگهی</a>
                <a href="#" class="hero-chip"><i class="fas fa-shop"></i> فروشگاه</a>
            </div>

        </div>
    </div>
</section>
