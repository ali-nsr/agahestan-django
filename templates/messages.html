{% if messages %}
    <div class="flash-messages-wrap" id="flashMessages">
        {% for message in messages %}
            <div class="flash-message flash-{{ message.tags }}"
                 role="alert"
                 data-flash>
                <div class="flash-icon">
                    {% if message.tags == 'success' %}
                        <i class="fas fa-check-circle"></i>
                    {% elif message.tags == 'error' or message.tags == 'danger' %}
                        <i class="fas fa-times-circle"></i>
                    {% elif message.tags == 'warning' %}
                        <i class="fas fa-exclamation-triangle"></i>
                    {% elif message.tags == 'info' %}
                        <i class="fas fa-info-circle"></i>
                    {% else %}
                        <i class="fas fa-bell"></i>
                    {% endif %}
                </div>

                <div class="flash-body">
                    <div class="flash-text">{{ message }}</div>
                </div>

                <button type="button"
                        class="flash-close"
                        data-flash-close
                        aria-label="بستن">
                    <i class="fas fa-times"></i>
                </button>

                <div class="flash-progress"></div>
            </div>
        {% endfor %}
    </div>

    <style>
        /* ══════════════════════════════════════════
           Flash Messages — Modern
           ══════════════════════════════════════════ */
        .flash-messages-wrap {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: calc(100% - 40px);
            max-width: 440px;
            pointer-events: none;
        }

        /* ─── Message ─── */
        .flash-message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 14px 14px 16px;
            background: #fff;
            border-radius: 14px;
            border: 1.5px solid #eef1f6;
            box-shadow:
                0 4px 6px rgba(15, 23, 42, .04),
                0 10px 30px rgba(15, 23, 42, .1);
            position: relative;
            overflow: hidden;
            pointer-events: auto;
            animation: flashIn .4s cubic-bezier(.16, 1, .3, 1);
            padding-right: 44px;
        }

        @keyframes flashIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .flash-message.is-closing {
            animation: flashOut .3s ease forwards;
        }

        @keyframes flashOut {
            to {
                opacity: 0;
                transform: translateY(-12px) scale(.95);
            }
        }

        /* ─── Icon ─── */
        .flash-icon {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            margin-top: 1px;
        }

        /* ─── Body ─── */
        .flash-body {
            flex: 1;
            min-width: 0;
            padding-top: 4px;
        }

        .flash-text {
            font-size: 13.5px;
            font-weight: 600;
            line-height: 1.6;
            color: #1e293b;
        }

        /* ─── Close ─── */
        .flash-close {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s;
            padding: 0;
        }
        .flash-close:hover {
            background: #f1f5f9;
            color: #475569;
        }

        /* ─── Progress bar ─── */
        .flash-progress {
            position: absolute;
            bottom: 0;
            right: 0;
            height: 3px;
            width: 100%;
            transform-origin: right center;
            animation: flashProgress 5s linear forwards;
        }

        @keyframes flashProgress {
            from { transform: scaleX(1); }
            to   { transform: scaleX(0); }
        }

        /* ══════════════════════════════════════════
           Variants
           ══════════════════════════════════════════ */

        /* Success */
        .flash-success {
            border-color: #bbf7d0;
            background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%);
        }
        .flash-success .flash-icon {
            background: #dcfce7;
            color: #16a34a;
        }
        .flash-success .flash-text { color: #065f46; }
        .flash-success .flash-progress {
            background: linear-gradient(90deg, #22c55e, #16a34a);
        }

        /* Error / Danger */
        .flash-error, .flash-danger {
            border-color: #fecaca;
            background: linear-gradient(135deg, #ffffff 0%, #fef2f2 100%);
        }
        .flash-error .flash-icon, .flash-danger .flash-icon {
            background: #fee2e2;
            color: #dc2626;
        }
        .flash-error .flash-text, .flash-danger .flash-text { color: #991b1b; }
        .flash-error .flash-progress, .flash-danger .flash-progress {
            background: linear-gradient(90deg, #ef4444, #dc2626);
        }

        /* Warning */
        .flash-warning {
            border-color: #fde68a;
            background: linear-gradient(135deg, #ffffff 0%, #fffbeb 100%);
        }
        .flash-warning .flash-icon {
            background: #fef3c7;
            color: #d97706;
        }
        .flash-warning .flash-text { color: #92400e; }
        .flash-warning .flash-progress {
            background: linear-gradient(90deg, #f59e0b, #d97706);
        }

        /* Info */
        .flash-info {
            border-color: #bfdbfe;
            background: linear-gradient(135deg, #ffffff 0%, #eff6ff 100%);
        }
        .flash-info .flash-icon {
            background: #dbeafe;
            color: #2563eb;
        }
        .flash-info .flash-text { color: #1e40af; }
        .flash-info .flash-progress {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
        }

        /* Debug / Default */
        .flash-debug, .flash-message:not([class*="flash-success"]):not([class*="flash-error"]):not([class*="flash-danger"]):not([class*="flash-warning"]):not([class*="flash-info"]) {
            border-color: #e2e8f0;
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
        }
        .flash-message:not([class*="flash-success"]):not([class*="flash-error"]):not([class*="flash-danger"]):not([class*="flash-warning"]):not([class*="flash-info"]) .flash-icon {
            background: #f1f5f9;
            color: #475569;
        }
        .flash-message:not([class*="flash-success"]):not([class*="flash-error"]):not([class*="flash-danger"]):not([class*="flash-warning"]):not([class*="flash-info"]) .flash-progress {
            background: linear-gradient(90deg, #94a3b8, #64748b);
        }

        /* ══════════════════════════════════════════
           Hover (پیشرفت متوقف می‌شه)
           ══════════════════════════════════════════ */
        .flash-message:hover .flash-progress {
            animation-play-state: paused;
        }

        /* ══════════════════════════════════════════
           Responsive — موبایل
           ══════════════════════════════════════════ */
        @media (max-width: 575.98px) {
            .flash-messages-wrap {
                top: auto;
                bottom: 80px;   /* بالای bottom nav */
                left: 12px;
                right: 12px;
                transform: none;
                width: auto;
                max-width: none;
                gap: 8px;
            }
            .flash-message {
                padding: 12px 12px 12px 14px;
                border-radius: 12px;
                padding-right: 40px;
            }
            .flash-icon {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            .flash-text {
                font-size: 12.5px;
                line-height: 1.55;
            }
            .flash-close {
                width: 24px;
                height: 24px;
                font-size: 11px;
                top: 8px;
                left: 8px;
            }
            @keyframes flashIn {
                from {
                    opacity: 0;
                    transform: translateY(20px) scale(.96);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }
            @keyframes flashOut {
                to {
                    opacity: 0;
                    transform: translateY(12px) scale(.95);
                }
            }
        }

        /* ══════════════════════════════════════════
           Reduced motion
           ══════════════════════════════════════════ */
        @media (prefers-reduced-motion: reduce) {
            .flash-message,
            .flash-progress {
                animation: none !important;
            }
        }
    </style>

    <script>
        (function () {
            function closeFlash(el) {
                if (!el || el.classList.contains('is-closing')) return;
                el.classList.add('is-closing');
                setTimeout(function () {
                    el.remove();
                    var wrap = document.getElementById('flashMessages');
                    if (wrap && wrap.children.length === 0) {
                        wrap.remove();
                    }
                }, 300);
            }

            document.addEventListener('click', function (e) {
                var btn = e.target.closest('[data-flash-close]');
                if (btn) {
                    closeFlash(btn.closest('[data-flash]'));
                }
            });

            // بستن خودکار بعد از 5 ثانیه
            document.querySelectorAll('[data-flash]').forEach(function (el) {
                setTimeout(function () {
                    closeFlash(el);
                }, 5000);
            });
        })();
    </script>
{% endif %}
