upstream django_agahestan {
    server django_agahestan:8000;
}

upstream nextjs_agahestan {
    server nextjs_agahestan:3000;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    client_max_body_size 100M;

    # ==========================================
    # static and media location
    # ==========================================
    location /static/ {
        alias /staticfiles/;
    }

    location /media/ {
        alias /media/;
    }

    # ==========================================
    # apps location
    # ==========================================

    location /account/ {
        proxy_pass http://django_agahestan/account/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /ad/ {
        proxy_pass http://django_agahestan/ad/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /location/ {
        proxy_pass http://django_agahestan/location/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /chat/ {
        proxy_pass http://django_agahestan/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /social/ {
        proxy_pass http://django_agahestan/social/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }


    # ==========================================
    # django admin location
    # ==========================================
    location /admin/ {
        proxy_pass http://django_agahestan/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # Next.js
    # ==========================================

     location / {
        proxy_pass http://nextjs_agahestan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

}


