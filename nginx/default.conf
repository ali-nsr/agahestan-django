upstream django {
    server django:8000;
}

#upstream nextjs {
#    server nextjs:3000;
#}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    client_max_body_size 100M;

    # ==========================================
    # static and media location
    # ==========================================
    location /static/ {
        alias /staticfiles/;
    }

    location /media/ {
        alias /media/;
    }

    # ==========================================
    # apps location
    # ==========================================

    location /account/ {
        proxy_pass http://django/account/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /ad/ {
        proxy_pass http://django/ad/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /location/ {
        proxy_pass http://django/location/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /chat/ {
        proxy_pass http://django/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /social/ {
        proxy_pass http://django/social/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }


    # ==========================================
    # django admin location
    # ==========================================
    location /admin/ {
        proxy_pass http://django/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # Next.js
    # ==========================================
}


