services:
  nginx:
    container_name: nginx_agahestan
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/staticfiles  # ✅ استفاده از Named Volume
      - media_volume:/media
    depends_on:
      - django
    networks:
      - agahestan-network

  django:
    container_name: django_agahestan
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn config.wsgi --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles  # ✅ استفاده از Named Volume
      - media_volume:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      - db
      - redis
    ports:
      - "8001:8000"
    networks:
      - agahestan-network

  db:
    image: postgres:16.9
    container_name: db_agahestan
    restart: always
    volumes:
      - postgres_data_agahestan:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    networks:
      - agahestan-network

  celery:
    container_name: celery_agahestan
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config worker --beat -l INFO -Q celery,celery:1,celery:2,celery:3
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      - redis
      - db
      - django
    networks:
      - agahestan-network

  redis:
    image: redis
    container_name: redis_agahestan
    restart: always
    ports:
      - "6380:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data_volume:/data
    networks:
      - agahestan-network

networks:
  agahestan-network:
    driver: bridge



volumes:
  postgres_data_agahestan:
  redis_data_volume:
  static_volume:
  media_volume:
