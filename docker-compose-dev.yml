services:
  django_agahestan:
    container_name: django_agahestan
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume_agahestan:/app/staticfiles  # ✅ استفاده از Named Volume
      - media_volume_agahestan:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      - db_agahestan
      - redis_agahestan
    ports:
      - "8000:8000"
    networks:
      - agahestan-network

  db_agahestan:
    image: postgres:16.9
    container_name: db_agahestan
    restart: always
    volumes:
      - postgres_data_agahestan:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    networks:
      - agahestan-network

  celery_agahestan:
    container_name: celery_agahestan
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config worker --beat -l INFO -Q celery,celery:1,celery:2,celery:3
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      - redis_agahestan
      - db_agahestan
      - django_agahestan
    networks:
      - agahestan-network

  redis_agahestan:
    image: redis
    container_name: redis_agahestan
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data_volume_agahestan:/data
    networks:
      - agahestan-network

networks:
  agahestan-network:
    driver: bridge



volumes:
  postgres_data_agahestan:
  redis_data_volume_agahestan:
  static_volume_agahestan:
  media_volume_agahestan:
